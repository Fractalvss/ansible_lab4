---
- name: Install Nginx
  package:
    name: nginx
    state: present

- name: Create vhost document root
  file:
    path: /var/www/{{ item.name }}
    state: directory
    mode: '0755'
  loop: "{{ vhosts }}"

- name: Deploy index.html template
  template:
    src: index.html.j2
    dest: /var/www/{{ item.name }}/index.html
    mode: '0644'
  loop: "{{ vhosts }}"

- name: Deploy vhost configuration
  template:
    src: vhost.conf.j2
    dest: /etc/nginx/conf.d/{{ item.name }}.conf
    mode: '0644'
  loop: "{{ vhosts }}"
  notify: Restart Nginx

- name: Ensure Nginx is started and enabled
  service:
    name: nginx
    state: started
    enabled: yes
